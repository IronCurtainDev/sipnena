version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      hono:
        patterns:
          - "hono"
          - "@hono/*"
          - "hono-*"
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Majors held until their ecosystems catch up; see docs/upgrading.md.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
  # Workflows pin actions by commit SHA; Dependabot updates the SHA and comment.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Reviewed by the Flutter developer, who owns apps/mobile.
  - package-ecosystem: pub
    directory: /apps/mobile
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
