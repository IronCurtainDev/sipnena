name: react_hono_flutter_template
description: "Flutter Clean Architecture & BLoC Starter Boilerplate."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  adaptive_dialog: ^2.8.0
  app_badge_plus: ^1.3.5
  awesome_dio_interceptor: ^1.3.0
  cached_network_image: ^4.0.0
  carousel_slider: ^5.1.1
  check_disposable_email: ^0.2.1
  connectivity_plus: ^7.3.1
  copy_with_extension: ^17.1.0
  country_picker: ^2.0.27
  device_info_plus: ^13.2.0
  dio: ^5.8.0+1
  equatable: ^2.0.5
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_image_compress: ^2.3.0
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  flutter_secure_storage: ^11.0.0
  flutter_stripe: ^14.0.0
  flutter_svg: ^2.1.0
  font_awesome_flutter: ^11.0.0
  gap: ^3.0.1
  geolocator: ^14.0.2
  get_it: ^9.2.1
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  google_maps_flutter: ^2.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hydrated_bloc: ^11.0.0
  image_cropper: ^12.2.1
  image_picker: ^1.1.2
  image_picker_android: any
  image_picker_platform_interface: any
  infinite_scroll_pagination: ^5.1.1
  intl: ^0.20.2
  otp_autofill: ^4.1.0
  path: ^1.9.1
  path_provider: ^2.1.4
  permission_handler: ^13.0.2
  pinput: ^6.0.2
  pusher_channels_flutter: ^2.2.1
  recase: ^4.1.0
  share_plus: ^13.3.0
  shimmer: ^4.0.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.10.4
  copy_with_extension_gen: ^17.1.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4  
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - env/.env.development
    - env/.env.production
    - assets/images/
  fonts:
    - family: ApercuPro
      fonts:
        - asset: assets/fonts/apercu_bold_pro.otf
          weight: 700
        - asset: assets/fonts/apercu_medium_pro.otf
          weight: 600
        - asset: assets/fonts/apercu_regular_pro.otf
          weight: 400

